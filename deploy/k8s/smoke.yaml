apiVersion: batch/v1
kind: Job
metadata:
  name: wms-smoke
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: wms:ci
          imagePullPolicy: IfNotPresent
          command: ["wms", "sim", "--url", "http://wms:8000", "--until", "10:00", "--check"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wms-db
                  key: DATABASE_URL
