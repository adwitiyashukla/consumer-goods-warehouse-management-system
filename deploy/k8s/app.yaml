apiVersion: apps/v1
kind: Deployment
metadata:
  name: dockhand
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dockhand
  template:
    metadata:
      labels:
        app: dockhand
    spec:
      containers:
        - name: dockhand
          image: dockhand:ci
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dockhand-db
                  key: DATABASE_URL
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dockhand
spec:
  selector:
    app: dockhand
  ports:
    - port: 8000
      targetPort: 8000
