services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dockhand
      POSTGRES_PASSWORD: dockhand
      POSTGRES_DB: dockhand
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockhand"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    command: ["dockhand", "serve", "--demo"]
    environment:
      DATABASE_URL: postgresql://dockhand:dockhand@db:5432/dockhand
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
