name: wms

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms
      POSTGRES_DB: wms
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    command: ["wms", "serve", "--demo"]
    environment:
      DATABASE_URL: postgresql://wms:wms@db:5432/wms
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
